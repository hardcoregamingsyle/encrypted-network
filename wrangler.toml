# Deploy steps, the server key and the limits are written down in scripts/DEPLOY.md.
# The signing key is a secret (SERVER_SIGNING_JWK), it never goes in this file.
name = "hrdlock"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"

# Fill in the real id after running: wrangler d1 create hrdlock
# Then apply the schema: wrangler d1 migrations apply DB --remote  (every file in migrations/, in order)
[[d1_databases]]
binding = "DB"
database_name = "hrdlock"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Create with: wrangler r2 bucket create hrdlock-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "hrdlock-files"
